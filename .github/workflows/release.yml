name: Release

# Deliberately NOT triggered by pushing a v* tag.
#
# HACS installs from the default branch only while a repo has no published
# releases; the moment one exists it pins to that release instead. Tags here
# are used as plain bookmarks for "this commit worked", so auto-publishing a
# release from every tag would silently switch HACS off latest-commit
# tracking. Cutting a release is therefore an explicit, manual choice.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (blank = use manifest.json)"
        required: false
        default: ""

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(python3 -c "import json; print(json.load(open('custom_components/voice_jellyfin/manifest.json'))['version'])")
          fi
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${VERSION}"

      - name: Create tag if it does not exist
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin — reusing it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Voice Jellyfin ${TAG}"
            git push origin "${TAG}"
            echo "Created and pushed ${TAG}."
          fi

      - name: Update manifest version
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" \
            custom_components/voice_jellyfin/manifest.json

      - name: Create release archive
        run: |
          zip -r "voice_jellyfin-${{ steps.version.outputs.TAG }}.zip" \
            custom_components/voice_jellyfin/ \
            hacs.json \
            README.md \
            LICENSE \
            -x "**/__pycache__/*" "**/*.pyc" "**/.DS_Store"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.version.outputs.TAG }}"
          name: "Voice Jellyfin ${{ steps.version.outputs.TAG }}"
          generate_release_notes: true
          files: "voice_jellyfin-${{ steps.version.outputs.TAG }}.zip"
          body: |
            ## Voice Jellyfin ${{ steps.version.outputs.TAG }}

            Accessibility-focused voice control for Jellyfin via Home Assistant.

            ### Installation via HACS
            1. Open HACS → Integrations → ⋮ → Custom repositories
            2. Add `https://github.com/dez011/hacs-voice-jellyfin` as an Integration
            3. Search "Voice Jellyfin" and install

            ### Manual Installation
            Download `voice_jellyfin-${{ steps.version.outputs.TAG }}.zip`, extract, and copy
            `custom_components/voice_jellyfin/` to your HA `custom_components/` directory.
